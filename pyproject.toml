[project]
name = "agentos"
version = "0.1.0"
description = "Local-first agent runtime: planner/executor, MCP tools, memory and benchmarks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.15.1",
    "httpx>=0.28.1",
    "mcp>=2.2.0,<3",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
agentos = "agentos.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
